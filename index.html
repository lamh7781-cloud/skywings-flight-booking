<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tìm và đặt chuyến bay dễ dàng cùng SkyWings.">
  <title>SkyWings - Tìm chuyến bay</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg bg-white py-3" aria-label="Điều hướng chính">
      <div class="container">
        <a class="navbar-brand d-inline-flex align-items-center gap-2" href="#" aria-label="SkyWings - Trang chủ">
          <svg class="brand-mark" width="32" height="32" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M2.5 13.2 21.3 4.5c.6-.3 1.2.3.9.9l-8.7 18.1c-.3.6-1.2.5-1.3-.2l-1.4-6.7-6.9-2.1c-.7-.2-.9-1-.4-1.3Z" fill="currentColor"/>
            <path d="m10.8 16.6 4.8-5.1" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
          SkyWings
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Mở menu điều hướng">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavigation">
          <ul class="navbar-nav mx-auto my-3 my-lg-0 gap-lg-3">
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html">Trang chủ</a></li>
            <li class="nav-item"><a class="nav-link" href="flight-list.html">Chuyến bay</a></li>
            <li class="nav-item"><a class="nav-link" href="#tim-chuyen-bay">Đặt vé máy bay</a></li>
            <li class="nav-item"><a class="nav-link" href="#uu-dai">Ưu đãi</a></li>
            <li class="nav-item"><a class="nav-link" href="#lien-he">Liên hệ</a></li>
          </ul>
          <a class="btn btn-outline-primary rounded-pill px-4" href="#dang-nhap">Đăng nhập</a>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section class="hero d-flex align-items-center" aria-labelledby="hero-title">
      <div class="container">
        <div class="row">
          <div class="col-lg-10 col-xl-9">
            <p class="hero-kicker mb-3">Mở lối hành trình của bạn</p>
            <h1 class="hero-title mb-3" id="hero-title">Bay đến nơi bạn luôn muốn đến</h1>
            <p class="text-secondary fs-5 mb-4">Tìm chuyến bay phù hợp và bắt đầu chuyến đi tiếp theo cùng SkyWings.</p>
          </div>
        </div>

        <div class="card search-card bg-white mt-4" id="tim-chuyen-bay">
          <div class="card-body p-4 p-lg-5">
            <h2 class="h4 fw-bold mb-4">Tìm chuyến bay</h2>
            <form action="flight-list.html" method="get">
              <div class="row g-3 align-items-end">
                <div class="col-12 col-md-6 col-xl-3">
                  <label class="form-label" for="diem-di">Điểm đi</label>
                  <input class="form-control" id="diem-di" name="diem_di" type="text" placeholder="Ví dụ: Hà Nội (HAN)" autocomplete="off" required>
                </div>
                <div class="col-12 col-md-6 col-xl-3">
                  <label class="form-label" for="diem-den">Điểm đến</label>
                  <input class="form-control" id="diem-den" name="diem_den" type="text" placeholder="Ví dụ: Đà Nẵng (DAD)" autocomplete="off" required>
                </div>
                <div class="col-12 col-md-6 col-xl-2">
                  <label class="form-label" for="ngay-di">Ngày đi</label>
                  <input class="form-control" id="ngay-di" name="ngay_di" type="date" required>
                </div>
                <div class="col-12 col-md-6 col-xl-2">
                  <label class="form-label" for="ngay-ve">Ngày về</label>
                  <input class="form-control" id="ngay-ve" name="ngay_ve" type="date">
                </div>
                <div class="col-12 col-xl-2">
                  <button class="btn btn-primary btn-skywings w-100" type="submit">Tìm chuyến bay</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
