<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Nhập thông tin hành khách để tiếp tục đặt vé cùng SkyWings.">
  <title>Thông tin hành khách - SkyWings</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
  <header>
    <nav class="navbar navbar-expand-lg bg-white py-3" aria-label="Điều hướng chính">
      <div class="container">
        <a class="navbar-brand" href="index.html" aria-label="SkyWings - Trang chủ">SkyWings</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Mở menu điều hướng">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavigation">
          <ul class="navbar-nav ms-auto my-3 my-lg-0 gap-lg-3">
            <li class="nav-item"><a class="nav-link" href="index.html">Trang chủ</a></li>
            <li class="nav-item"><a class="nav-link" href="flight-list.html">Chuyến bay</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-8 col-xl-7">
          <div class="mb-4">
            <p class="text-primary fw-semibold mb-2">BƯỚC 2 / 2</p>
            <h1 class="h2 fw-bold mb-2">Thông tin hành khách</h1>
            <p class="text-secondary mb-0">Vui lòng nhập thông tin liên hệ để tiếp tục đặt vé.</p>
          </div>

          <section class="card search-card border-0 mb-4 d-none" id="selected-flight" aria-labelledby="selected-flight-heading">
            <div class="card-body p-4">
              <h2 class="h5 fw-bold mb-3" id="selected-flight-heading">Chuyến bay đã chọn</h2>
              <p class="mb-1"><strong>Mã chuyến:</strong> <span id="flight-number"></span></p>
              <p class="mb-1"><strong>Hành trình:</strong> <span id="flight-route"></span></p>
              <p class="mb-1"><strong>Ngày đi:</strong> <span id="flight-date"></span></p>
              <p class="mb-0"><strong>Giá vé demo:</strong> <span id="flight-price"></span></p>
            </div>
          </section>

          <section class="card search-card border-0" aria-labelledby="passenger-heading">
            <div class="card-body p-4 p-md-5">
              <h2 class="h5 fw-bold mb-4" id="passenger-heading">Thông tin liên hệ</h2>

              <form id="booking-form">
                <div class="mb-3">
                  <label class="form-label" for="full-name">Họ và tên</label>
                  <input
                    class="form-control"
                    id="full-name"
                    name="full_name"
                    type="text"
                    autocomplete="name"
                    placeholder="Nhập họ và tên như trên giấy tờ tùy thân"
                    required
                  >
                </div>

                <div class="mb-3">
                  <label class="form-label" for="email">Email</label>
                  <input
                    class="form-control"
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    placeholder="ban@example.com"
                    required
                  >
                </div>

                <div class="mb-4">
                  <label class="form-label" for="phone">Số điện thoại</label>
                  <input
                    class="form-control"
                    id="phone"
                    name="phone"
                    type="tel"
                    autocomplete="tel"
                    placeholder="Ví dụ: 090 123 4567"
                    required
                  >
                </div>

                <p class="small text-secondary mb-4">
                  Đây là giao diện tĩnh. Thông tin chỉ dùng để minh họa và không được gửi lên máy chủ.
                </p>

                <button class="btn btn-primary btn-skywings w-100" type="submit">Xác nhận đặt vé</button>
                <div class="alert alert-info mt-3 mb-0 d-none" id="booking-message" role="status" aria-live="polite"></div>
              </form>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById("booking-form").addEventListener("submit", function (event) {
      event.preventDefault();
      const message = document.getElementById("booking-message");
      const bookingReference = `SW${Date.now().toString().slice(-8)}`;
      message.textContent = `Đặt chỗ demo thành công. Mã tham khảo: ${bookingReference}. Chưa có thanh toán hoặc vé thật được tạo.`;
      message.classList.remove("d-none");
    });

    const bookingParams = new URLSearchParams(window.location.search);
    const flightNumber = bookingParams.get("flight");
    const flightPrice = Number(bookingParams.get("price"));

    if (flightNumber) {
      document.getElementById("selected-flight").classList.remove("d-none");
      document.getElementById("flight-number").textContent = flightNumber;
      document.getElementById("flight-route").textContent =
        `${bookingParams.get("diem_di") || "Chưa chọn"} → ${bookingParams.get("diem_den") || "Chưa chọn"}`;
      document.getElementById("flight-date").textContent =
        bookingParams.get("ngay_di") || "Chưa chọn";
      document.getElementById("flight-price").textContent = flightPrice
        ? `${new Intl.NumberFormat("vi-VN").format(flightPrice)}đ`
        : "Chưa có thông tin";
    }
  </script>
</body>
</html>
